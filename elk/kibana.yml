# Mounted over the image's default kibana.yml, so its one essential line is repeated here.
# Everything else comes from environment variables in docker-compose.yml.
server.host: "0.0.0.0"

# Fleet preconfiguration: created on every Kibana start if missing (read-only in the UI).
xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest
  - name: windows
    version: latest
xpack.fleet.agentPolicies:
  # Log collection only. No Elastic Defend here: it would register as AV and push MDE into passive mode.
  - name: Windows Endpoints
    id: windows-endpoints
    namespace: default
    monitoring_enabled: [logs, metrics]
    package_policies:
      - name: system-windows-endpoints  # Security, System, Application logs + host metrics
        id: system-windows-endpoints
        package:
          name: system
      - name: windows-windows-endpoints  # Sysmon, PowerShell, Defender channels
        id: windows-windows-endpoints
        package:
          name: windows
  - name: Fleet Server Policy
    id: fleet-server-policy
    namespace: default
    package_policies:
      - name: fleet_server-1
        id: fleet_server-1
        package:
          name: fleet_server
xpack.fleet.fleetServerHosts:
  - id: default-fleet-server
    name: Default
    is_default: true
    host_urls: ["https://${ELK_FQDN}:8220"]
